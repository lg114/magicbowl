<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .bowl {
        fill: none;
        stroke: #b8a88a;
        stroke-width: 2.5;
        stroke-linecap: round;
      }
      .star {
        fill: #b8a88a;
      }
    </style>
  </defs>
  
  <!-- Bowl shape -->
  <path class="bowl" d="M 12 32 Q 12 52 32 52 Q 52 52 52 32" />
  
  <!-- Magic star/sparkle above bowl -->
  <path class="star" d="M 32 14 L 33.5 18 L 37.5 18 L 34.5 20.5 L 36 24.5 L 32 22 L 28 24.5 L 29.5 20.5 L 26.5 18 L 30.5 18 Z" />
  
  <!-- Small sparkle dots -->
  <circle class="star" cx="20" cy="20" r="1.5" />
  <circle class="star" cx="44" cy="20" r="1.5" />
</svg>
